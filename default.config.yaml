# yaml-language-server: $schema=./.kokimoki/schema.json

# Translations
title: 'Host Starter'

gameLobbyMd: |
  # Game Lobby

  This is a sample markdown to demonstrate various markdown features.

  ## Starting soon

  Game is starting soon. **Get ready!**

  ## Rules

  1. Wait for the host to start the game.
  2. Follow the instructions on the presenter screen.
  3. Open [Games for Crowds](https://gamesforcrowds.com) for more info.

  ## What people say

  > **This game is awesome!** - Player 1

  > **I had a good time playing this.** - Player 2

  > **Always looking forward to the next round!**  - Player 3

  ---

  ## Sample Code

  ```
  // Code block
  console.log('Hello, world!');
  ```

  ## Sample Image

  ![Logo](/logo.svg)

connectionsMd: |
  Scan the QR to join the game.

sharedStateMd: |
  # Shared State Host
  This is an example of shared state view. Host can start the game, open the presenter screen and allow players to join by scanning the QR.

  ## Host Actions
  Here's a demo of dashboard actions that can be used to control the state on presenter and player screens.

sharedStatePlayerMd: |
  # Shared State Player
  You are connected as a player. Host has started the game. In this shared state example the playtime is synchronized between all players.

players: 'Players Connected'
online: 'Online'
offline: 'Offline'
startButton: 'Start Game'
stopButton: 'Stop Game'

loading: 'Loading...'

menuHelpMd: |
  # Help

  This is the help section. Here you can find information about how to play the game and get assistance if needed.

  ## How to Play

  1. Join the game using the provided link or QR code.
  2. Follow the instructions on your screen.
  3. Interact with other players as required by the game.

  ## Getting Assistance

  If you encounter any issues, please contact the host or refer to the FAQ section on our website.

createProfileMd: |
  # Welcome!

  Please enter your name to join the game.

playerNamePlaceholder: 'Your name...'
playerNameLabel: 'Name:'
playerNameButton: 'Continue'

playerLinkLabel: 'Player Link'
presenterLinkLabel: 'Presenter Link'

togglePresenterQrButton: 'Toggle Presenter QR'
openPlayerHelpButton: 'Force Players Help to Open'

menuAriaLabel: 'Open menu drawer'
menuHelpAriaLabel: 'Open help drawer'

# Game phase settings (in milliseconds)
goPhaseDurationMs: 5000
warningPhaseDurationMs: 1500
freezePhaseDurationMs: 3000

# Variable phase length ranges
goPhaseMinMs: 3000
goPhaseMaxMs: 7000
freezePhaseMinMs: 2000
freezePhaseMaxMs: 5000
variablePhasesEnabled: true

# Shake detection settings
shakeThreshold: 12

# Progress calculation weights
magnitudeWeight: 0.01
activeCountWeight: 0.5

# Penalty settings
freezeViolationThreshold: 0.05
penaltyDistance: 10
totalDistance: 100

# Team selection view
teamSelectTitle: 'Choose Your Team'
teamSelectDescription: 'Pick a team and help them steal the trophy!'
motionPermissionDescription: 'This game uses your phone motion sensor. Please enable it to play.'
motionPermissionButton: 'Enable Motion Sensor'
motionPermissionGranted: 'Motion sensor enabled!'

# Team manager (host)
teamManagerTitle: 'Team Manager'
teamManagerDescription: 'Click the arrows to move players between teams'
teamsBalanced: 'Teams are balanced'
teamsUnbalanced: 'Teams unbalanced by {diff} players'
noPlayersOnTeam: 'No players yet'
unassignedPlayers: 'Unassigned Players'
moveToRed: 'Move to Red team'
moveToBlue: 'Move to Blue team'
redTeamShort: 'Red'
blueTeamShort: 'Blue'

# Game phase text
goPhaseText: 'GO!'
warningPhaseText: 'WARNING!'
freezePhaseText: 'FREEZE!'

# Player game view
shakeIntensityLabel: 'Shake Intensity'
movementDetected: '⚠️ Movement detected!'
goPhaseInstruction: 'Shake your phone to move your team forward!'
warningPhaseInstruction: 'Get ready to freeze...'
freezePhaseInstruction: 'Hold perfectly still! Any movement = penalty!'

# Victory
victoryText: 'WINS!'
waitingForTeam: 'Waiting for game to start...'

# MVP Spotlight
mvpSpotlightEnabled: true
mvpLabel: '⭐ TOP SHAKER'

# Traitor Mode
traitorModeEnabled: false
traitorSecretMessage: '🔥 You are the TRAITOR! Shake during FREEZE to help the other team!'
traitorRevealMessage: 'The traitor was revealed!'
